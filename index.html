<style>
:root{--bg:#0b0a0d;--panel:#141116;--panel2:#1b151c;--line:#352737;--pink:#ff4fa3;--pink2:#ff8ac2;--text:#fff7fb;--muted:#bdaebb;--good:#79d99b}

button,input,select,textarea{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}

h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:2px}
.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) auto auto auto;gap:9px;margin:12px 0}
input,select,textarea{width:100%;background:#100d11;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;outline:none}

button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 13px;cursor:pointer}

.fav{padding:4px 7px;background:transparent;color:#75616d}.fav.on{color:#ffd66b}
.announcement{margin:13px 0;background:#0f0c10;border-radius:9px;padding:10px;min-height:61px;word-break:break-word}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.actions button{font-size:12px;padding:7px 9px}.count{margin-left:auto;color:var(--muted);font-size:11px}
.empty{display:none;text-align:center;color:var(--muted);padding:45px}

<header><div class="wrap"><div class="brand"><div class="logo">L99</div><div><h1>Liberty99 Events</h1><div class="sub">Find it. Copy it. Host it.</div></div></div></div></header>
<main class="wrap">
  <div class="toolbar">
    <input id="q" placeholder="Search events…" autocomplete="off">
    <button id="randomBtn">🎲 Random</button>
    <button id="favBtn">★ Favorites</button>
    <button id="locationsBtn">📍 Locations</button>
    <button id="addBtn" class="primary">＋ Add Event</button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="meta"><span id="shown"></span> of <span id="total"></span> events</div>
  <div class="recent" id="recent"><b>Recently Used</b><span id="recentItems"></span></div>
  <section class="grid" id="grid"></section>
  <div class="empty" id="empty">No matching events.</div>
</main>

<div class="overlay" id="locationsOverlay"><div class="modal">
  <div class="modalTop"><div><h2>📍 Liberty99 Locations</h2><div class="note">Search a location and copy its coordinates.</div></div><button class="close" data-close>✕</button></div>
  <input class="locSearch" id="locQ" placeholder="Search locations…" autocomplete="off">
  <div class="locList" id="locList"></div>
</div></div>

<div class="overlay" id="eventOverlay"><div class="modal">
  <div class="modalTop"><div><h2 id="formTitle">＋ Add My Event</h2><div class="note">Saved only on this browser/device.</div></div><button class="close" data-close>✕</button></div>
  <form class="form" id="eventForm">
    <input type="hidden" id="editId">
    <div class="row2">
      <div class="field"><label>Event name</label><input id="evName" maxlength="70" required placeholder="e.g. Reverse Relay"></div>
      <div class="field"><label>Category</label><input id="evCategory" maxlength="40" required placeholder="e.g. Race"></div>
    </div>
    <div class="field"><label><span>F3 announcement</span><span id="f3Count">0/80</span></label><textarea id="evF3" rows="3" maxlength="80" required placeholder="Keep it short and ready to paste."></textarea></div>
    <div class="row2">
      <div class="field"><label>Location <span>(optional)</span></label><select id="evLocation"><option value="">No location selected</option></select></div>
      <div class="field"><label>Setup <span>(optional)</span></label><select id="evSetup"><option>Easy</option><option>Needs Setup</option><option>Needs Vehicles</option></select></div>
    </div>
    <div class="field"><label>How to run <span>(optional)</span></label><textarea id="evHow" rows="3" maxlength="500" placeholder="Only the important instructions."></textarea></div>
    <div class="formActions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">Save Event</button></div>
  </form>
</div></div>

const $=id=>document.getElementById(id);
const read=(k,d=[])=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const setupTag=e=>{if(e.setup)return e.setup;const c=e.category.toLowerCase(),n=e.name.toLowerCase();if(['airport sprint','beach run'].includes(n))return'Easy';if(c.includes('vehicle')||c.includes('race'))return'Needs Vehicles';if(c.includes('social')||c.includes('trivia')||c.includes('party')||c.includes('luck')||c.includes('search'))return'Easy';if(c.includes('melee')||c.includes('survival')||c.includes('hide'))return'Needs Setup';return'Easy'};
let myEvents=read('l99MyEvents',[]),favs=new Set(read('l99Favs',[])),recent=read('l99Recent',[]).slice(0,8),active='All',favOnly=false;
const allEvents=()=>[...baseEvents,...myEvents.map(e=>({...e,mine:true,icon:e.icon||'🎉'}))];
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function copy(v,b){try{await navigator.clipboard.writeText(v)}catch{const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}if(b){const o=b.textContent;b.textContent='✓ Copied';setTimeout(()=>b.textContent=o,800)}}
function buildFilters(){const cats=['All',...new Set(allEvents().map(e=>e.category))];$('filters').innerHTML=cats.map(c=>`<button class="filter ${c===active?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat;buildFilters();render()})}
function markRecent(n){recent=[n,...recent.filter(x=>x!==n)].slice(0,8);write('l99Recent',recent);renderRecent()}
function renderRecent(){const box=$('recent');box.style.display=recent.length?'block':'none';$('recentItems').innerHTML=recent.map(n=>`<button class="chip" data-recent="${esc(n)}">${esc(n)}</button>`).join('');document.querySelectorAll('[data-recent]').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.recent;render()})}
function render(){
 const term=$('q').value.trim().toLowerCase();let list=allEvents().filter(e=>(active==='All'||e.category===active)&&(!favOnly||favs.has(e.name))&&(!term||`${e.name} ${e.category} ${e.text} ${e.how||''} ${e.location||''}`.toLowerCase().includes(term)));
 list.sort((a,b)=>(Number(favs.has(b.name))-Number(favs.has(a.name)))||a.name.localeCompare(b.name));
 $('total').textContent=allEvents().length;$('shown').textContent=list.length;$('empty').style.display=list.length?'none':'block';
 $('grid').innerHTML=list.map(e=>`<article class="card ${e.mine?'mine':''}">
 <div class="head"><span class="ico">${esc(e.icon||'🎉')}</span><div class="title"><strong>${esc(e.name)}</strong><div class="tags"><span class="tag">${esc(e.category)}</span><span class="tag">${esc(setupTag(e))}</span>${e.mine?'<span class="tag mine">MY EVENT</span>':''}</div></div><button class="fav ${favs.has(e.name)?'on':''}" data-fav="${esc(e.name)}">★</button></div>
 <div class="announcement">${esc(e.text)}</div>
 ${(e.mine&&(e.how||e.location))?`<div class="details" hidden data-details-for="${esc(e.id)}">${e.location?`<div><b>Location:</b> ${esc(e.location)}</div>`:''}${e.how?`<div><b>How to run:</b> ${esc(e.how)}</div>`:''}</div>`:''}
 <div class="actions"><button data-copy="${esc(e.name)}" data-text="${esc(e.text)}">Copy Announcement</button><button data-copyname="${esc(e.name)}">Copy Name</button>${e.mine?`<button data-details="${esc(e.id)}">Details</button><button data-edit="${esc(e.id)}">Edit</button><button class="danger" data-delete="${esc(e.id)}">Delete</button>`:''}<span class="count">${[...e.text].length}/80</span></div></article>`).join('');
 document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{favs.has(b.dataset.fav)?favs.delete(b.dataset.fav):favs.add(b.dataset.fav);write('l99Favs',[...favs]);render()});
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{markRecent(b.dataset.copy);copy(b.dataset.text,b)});
 document.querySelectorAll('[data-copyname]').forEach(b=>b.onclick=()=>copy(b.dataset.copyname,b));
 document.querySelectorAll('[data-details]').forEach(b=>b.onclick=()=>{const x=document.querySelector(`[data-details-for="${CSS.escape(b.dataset.details)}"]`);if(x)x.hidden=!x.hidden});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(myEvents.find(x=>x.id===b.dataset.edit)));
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this saved event?')){myEvents=myEvents.filter(x=>x.id!==b.dataset.delete);write('l99MyEvents',myEvents);buildFilters();render()}});
}
function renderLocations(){const t=$('locQ').value.trim().toLowerCase();const list=locations.filter(x=>`${x.name} ${x.notes}`.toLowerCase().includes(t));$('locList').innerHTML=list.map(x=>{const coords=x.notes.replace(/^Coordinates:\s*/i,'');return `<div class="loc"><div><strong>${esc(x.name)}</strong><div class="coords">${esc(coords)}</div></div><button data-coords="${esc(coords)}">Copy Coords</button></div>`}).join('')||'<div class="empty" style="display:block">No matching locations.</div>';document.querySelectorAll('[data-coords]').forEach(b=>b.onclick=()=>copy(b.dataset.coords,b))}
function openOverlay(id){$(id).classList.add('show')}function closeOverlays(){document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('show'))}
function openForm(e=null){$('formTitle').textContent=e?'Edit My Event':'＋ Add My Event';$('editId').value=e?.id||'';$('evName').value=e?.name||'';$('evCategory').value=e?.category||'';$('evF3').value=e?.text||'';$('evLocation').value=e?.location||'';$('evSetup').value=e?.setup||'Easy';$('evHow').value=e?.how||'';updateCount();openOverlay('eventOverlay')}
function updateCount(){$('f3Count').textContent=[...$('evF3').value].length+'/80'}
$('eventForm').onsubmit=e=>{e.preventDefault();const id=$('editId').value||('my-'+Date.now());const obj={id,name:$('evName').value.trim(),category:$('evCategory').value.trim(),text:$('evF3').value.trim(),location:$('evLocation').value,setup:$('evSetup').value,how:$('evHow').value.trim(),icon:'🎉'};if(!obj.name||!obj.category||!obj.text)return;const i=myEvents.findIndex(x=>x.id===id);i>=0?myEvents[i]=obj:myEvents.unshift(obj);write('l99MyEvents',myEvents);closeOverlays();buildFilters();render()}
$('q').oninput=render;$('locQ').oninput=renderLocations;$('evF3').oninput=updateCount;
$('randomBtn').onclick=()=>{let pool=allEvents().filter(e=>(active==='All'||e.category===active)&&(!favOnly||favs.has(e.name)));const fresh=pool.filter(e=>!recent.includes(e.name));if(fresh.length)pool=fresh;if(!pool.length)return;const p=pool[Math.floor(Math.random()*pool.length)];$('q').value=p.name;render();setTimeout(()=>document.querySelector('.card')?.scrollIntoView({behavior:'smooth',block:'center'}),50)};
$('favBtn').onclick=()=>{favOnly=!favOnly;$('favBtn').textContent=favOnly?'★ Showing Favorites':'★ Favorites';render()};
$('locationsBtn').onclick=()=>{renderLocations();openOverlay('locationsOverlay')};$('addBtn').onclick=()=>openForm();
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeOverlays);document.querySelectorAll('.overlay').forEach(x=>x.onclick=e=>{if(e.target===x)closeOverlays()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlays()});
$('evLocation').innerHTML='<option value="">No location selected</option>'+locations.map(x=>`<option>${esc(x.name)}</option>`).join('');
buildFilters();renderRecent();render();
</script>
