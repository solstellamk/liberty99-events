function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function render(){const term=q.value.trim().toLowerCase();let list=events.filter(e=>(active==='All'||e.category===active)&&(!term||(`${e.name} ${e.category} ${e.text}`).toLowerCase().includes(term))&&(!favOnly||favs.has(e.name)));list.sort((a,b)=>(favs.has(b.name)-favs.has(a.name))||a.name.localeCompare(b.name));grid.innerHTML=list.map(e=>`<article class="card ${favs.has(e.name)?'favorited':''}"><div class="head"><span class="ico">${e.icon}</span><div><strong>${esc(e.name)}</strong><span class="tag">${esc(e.category)}</span><span class="setup">${setupTag(e)}</span></div><button class="fav ${favs.has(e.name)?'on':''}" data-name="${esc(e.name)}" title="Favorite">★</button></div><div class="announcement">${esc(e.text)}</div><div class="actions"><button class="copy" data-name="${esc(e.name)}" data-text="${esc(e.text)}">Copy Announcement</button><button class="copyname" data-name="${esc(e.name)}">Copy Name</button><span class="count">${[...e.text].length}/80</span></div></article>`).join('');shown.textContent=list.length;empty.style.display=list.length?'none':'block';document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>copyText(b));document.querySelectorAll('.copyname').forEach(b=>b.onclick=()=>copyName(b));document.querySelectorAll('.fav').forEach(b=>b.onclick=()=>toggleFav(b.dataset.name));}
function markRecent(name){recent=[name,...recent.filter(x=>x!==name)].slice(0,8);localStorage.setItem('l99Recent',JSON.stringify(recent));renderRecent();}
function renderRecent(){const box=document.getElementById('recentBox'),el=document.getElementById('recentItems');box.style.display=recent.length?'block':'none';el.innerHTML=recent.map(n=>`<button class="recent-chip" data-name="${esc(n)}">${esc(n)}</button>`).join('');el.querySelectorAll('.recent-chip').forEach(b=>b.onclick=()=>{q.value=b.dataset.name;render();});}
async function copyText(btn){const t=btn.dataset.text;markRecent(btn.dataset.name);try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}const old=btn.textContent;btn.textContent='✓ Copied';setTimeout(()=>btn.textContent=old,900);}
async function copyName(btn){const t=btn.dataset.name;try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}markRecent(t);const old=btn.textContent;btn.textContent='✓ Copied';setTimeout(()=>btn.textContent=old,900);}
function toggleFav(name){favs.has(name)?favs.delete(name):favs.add(name);localStorage.setItem('l99Favs',JSON.stringify([...favs]));render();}
document.getElementById('favOnlyBtn').onclick=()=>{favOnly=!favOnly;document.getElementById('favOnlyBtn').textContent=favOnly?'★ Showing Favorites':'★ Favorites';render();};
document.getElementById('randomBtn').onclick=()=>{let pool=events.filter(e=>(active==='All'||e.category===active)&&(!favOnly||favs.has(e.name)));if(!pool.length)return;const fresh=pool.filter(e=>!recent.slice(0,8).includes(e.name));if(fresh.length)pool=fresh;const pick=pool[Math.floor(Math.random()*pool.length)];markRecent(pick.name);q.value=pick.name;render();setTimeout(()=>grid.querySelector('.card')?.scrollIntoView({behavior:'smooth',block:'center'}),50);};
q.addEventListener('input',render);renderRecent();render();
</script></body></html>
